<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>VexaTrade – Offline</title>
  <style>
    /* ─── Reset & base ─── */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      height: 100%;
      background: #050812;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      color: #e5e7eb;
      display: flex;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    /* ─── Card container ─── */
    .card {
      max-width: 420px;
      width: 100%;
      background: #0a0e1a;
      border-radius: 36px;
      border: 1px solid rgba(255, 255, 255, 0.06);
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6);
      padding: 48px 32px 40px;
      text-align: center;
      backdrop-filter: blur(2px);
      transition: transform 0.2s ease;
    }

    /* ─── Logo ─── */
    .logo {
      display: flex;
      justify-content: center;
      margin-bottom: 24px;
    }
    .logo svg {
      width: 80px;
      height: 64px;
      filter: drop-shadow(0 0 12px rgba(34, 211, 238, 0.15));
    }

    /* ─── Icon ─── */
    .offline-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: rgba(239, 68, 68, 0.08);
      border: 1px solid rgba(239, 68, 68, 0.15);
      margin-bottom: 20px;
    }
    .offline-icon svg {
      width: 36px;
      height: 36px;
      stroke: #ef4444;
      stroke-width: 1.5;
      fill: none;
    }

    /* ─── Typography ─── */
    h2 {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.3px;
      color: #f9fafb;
      margin-bottom: 6px;
    }
    .subhead {
      font-size: 14px;
      color: #94a3b8;
      margin-bottom: 24px;
      line-height: 1.5;
    }
    .subhead strong {
      color: #22d3ee;
      font-weight: 600;
    }

    /* ─── Retry button ─── */
    .retry-btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: linear-gradient(135deg, #22d3ee 0%, #06b6d4 100%);
      color: #000;
      border: none;
      border-radius: 60px;
      padding: 14px 40px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 8px 24px rgba(6, 182, 212, 0.25);
      margin-top: 8px;
    }
    .retry-btn:hover {
      transform: scale(1.02);
      box-shadow: 0 12px 32px rgba(6, 182, 212, 0.35);
    }
    .retry-btn:active {
      transform: scale(0.97);
    }
    .retry-btn svg {
      width: 20px;
      height: 20px;
      stroke: currentColor;
      stroke-width: 2;
      fill: none;
    }

    /* ─── Footer ─── */
    .footer {
      margin-top: 28px;
      font-size: 12px;
      color: #475569;
      border-top: 1px solid rgba(255, 255, 255, 0.04);
      padding-top: 20px;
      letter-spacing: 0.3px;
    }
    .footer span {
      color: #22d3ee;
      font-weight: 500;
    }

    /* ─── Responsive ─── */
    @media (max-width: 480px) {
      .card {
        padding: 32px 20px 28px;
        border-radius: 28px;
      }
      h2 {
        font-size: 20px;
      }
      .subhead {
        font-size: 13px;
      }
      .retry-btn {
        padding: 12px 32px;
        font-size: 15px;
        width: 100%;
        justify-content: center;
      }
    }

    /* ─── Animations ─── */
    @keyframes pulse-ring {
      0% { transform: scale(0.95); opacity: 0.7; }
      50% { transform: scale(1.05); opacity: 1; }
      100% { transform: scale(0.95); opacity: 0.7; }
    }
    .offline-icon {
      animation: pulse-ring 2s ease-in-out infinite;
    }
  </style>
</head>
<body>

<div class="card">
  <!-- Logo -->
  <div class="logo">
    <!-- VexaTrade logo (simplified) – replace with your actual logo SVG if desired -->

  <!-- Offline icon -->
  <div class="offline-icon">
    <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">

    </svg>
  </div>

  <h2>You're offline</h2>
  <p class="subhead">
    Oops! It looks like you've lost your internet connection.<br />
    Don't worry, your funds are safe. <strong>VexaTrade</strong> will reconnect as soon as you're back online.
  </p>

  <!-- Retry button -->
  <button class="retry-btn" onclick="window.location.reload()">
    <svg viewBox="0 0 24 24">
      <path d="M23 4v6h-6" />
      <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10" />
    </svg>
    Try again
  </button>

  <div class="footer">
    <span>VexaTrade</span> · Your gateway to crypto
  </div>
</div>

</body>
</html>
