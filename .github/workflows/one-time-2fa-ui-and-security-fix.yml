name: One-time 2FA UI and security fix

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - name: Integrate staged 2FA setup UI
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          page = Path('frontend-user/src/pages/UserCenterPage.jsx')
          text = page.read_text(encoding='utf-8')

          if 'TwoFactorSetupModal' not in text:
              text = text.replace(
                  'import ImageCropper from "../components/ImageCropper";\n',
                  'import ImageCropper from "../components/ImageCropper";\nimport TwoFactorSetupModal from "../components/TwoFactorSetupModal";\n',
                  1,
              )

          if 'const [twoFactorModalOpen, setTwoFactorModalOpen]' not in text:
              marker = '  const [securityStatus, setSecurityStatus] = useState({\n    hasPasscode: false,\n    twofaEnabled: false,\n  });\n'
              replacement = marker + '  const [twoFactorModalOpen, setTwoFactorModalOpen] = useState(false);\n'
              if marker not in text:
                  raise SystemExit('security state marker not found')
              text = text.replace(marker, replacement, 1)

          old_button = 'onClick={() => securityStatus.hasPasscode ? setVerifyPasscodeModalOpen(true) : setPasscodeModalOpen(true)} className={`rounded-xl px-3 py-1.5 text-xs font-semibold sm:px-4 sm:py-2 sm:text-sm ${securityStatus.twofaEnabled ? "border border-white/10 bg-white/5 text-white" : "bg-emerald-500 text-black"}`}'
          new_button = 'onClick={() => { if (!securityStatus.twofaEnabled) setTwoFactorModalOpen(true); }} disabled={securityStatus.twofaEnabled} className={`rounded-xl px-3 py-1.5 text-xs font-semibold sm:px-4 sm:py-2 sm:text-sm ${securityStatus.twofaEnabled ? "border border-emerald-500/20 bg-emerald-500/5 text-emerald-300 cursor-default" : "bg-emerald-500 text-black"}`}'
          if old_button in text:
              text = text.replace(old_button, new_button, 1)
          elif 'setTwoFactorModalOpen(true)' not in text:
              raise SystemExit('2FA enable button marker not found')

          marker = '  return (\n'
          modal = '''  return (\n    <>\n      <TwoFactorSetupModal\n        open={twoFactorModalOpen}\n        token={token}\n        onClose={() => setTwoFactorModalOpen(false)}\n        onCompleted={() => {\n          setSecurityStatus(prev => ({ ...prev, twofaEnabled: true }));\n          showSuccess("Authenticator 2FA enabled successfully");\n        }}\n      />\n'''
          if '<TwoFactorSetupModal' not in text:
              if marker not in text:
                  raise SystemExit('return marker not found')
              text = text.replace(marker, modal, 1)
              # The existing outer page root must be closed inside the fragment.
              needle = '    </div>\n  );\n}'
              if needle not in text:
                  raise SystemExit('page closing marker not found')
              text = text.replace(needle, '    </div>\n    </>\n  );\n}', 1)

          page.write_text(text, encoding='utf-8')
          print('UserCenterPage 2FA integration complete')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend-user/src/pages/UserCenterPage.jsx
          if git diff --cached --quiet; then
            echo "No UserCenterPage changes required."
          else
            git commit -m "feat: integrate staged authenticator 2FA setup"
            git push origin HEAD:master
          fi