name: Repair UserCenter once

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - name: Repair UserCenter source
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('frontend-user/src/pages/UserCenterPage.jsx')
          text = p.read_text(encoding='utf-8')

          modal = '''      <TwoFactorSetupModal\n        open={twoFactorModalOpen}\n        token={token}\n        onClose={() => setTwoFactorModalOpen(false)}\n        onCompleted={() => {\n          setSecurityStatus(prev => ({ ...prev, twofaEnabled: true }));\n          showSuccess("Authenticator 2FA enabled successfully");\n        }}\n      />\n'''

          pattern = re.compile(r'  if \(loading\) \{.*?\n  return \(\n    <>\n      <TwoFactorSetupModal\n', re.S)
          replacement = '''  if (loading) {\n    return (\n      <div className="flex min-h-[60vh] items-center justify-center bg-[#050812]">\n        <div className="h-8 w-8 animate-spin rounded-full border-2 border-cyan-500 border-t-transparent" />\n      </div>\n    );\n  }\n\n  return (\n    <>\n''' + modal
          text2, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'Expected exactly one corrupted UserCenter loading/main region, found {count}')
          p.write_text(text2, encoding='utf-8')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend-user/src/pages/UserCenterPage.jsx
          if git diff --cached --quiet; then
            echo "UserCenter already repaired"
            exit 0
          fi
          git commit -m "fix: repair UserCenter JSX root structure"
          for attempt in 1 2 3 4 5; do
            git fetch origin master
            git rebase origin/master || { git rebase --abort; git reset --hard origin/master; continue; }
            if git push origin HEAD:master; then exit 0; fi
            git reset --hard HEAD~1
            exit 1
          done
          exit 1
