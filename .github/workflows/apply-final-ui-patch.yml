name: Apply final UI repair once

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - name: Apply exact source repairs
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('frontend-user/src/pages/UserCenterPage.jsx')
          text = p.read_text(encoding='utf-8')
          modal = '''      <TwoFactorSetupModal\n        open={twoFactorModalOpen}\n        token={token}\n        onClose={() => setTwoFactorModalOpen(false)}\n        onCompleted={() => {\n          setSecurityStatus(prev => ({ ...prev, twofaEnabled: true }));\n          showSuccess("Authenticator 2FA enabled successfully");\n        }}\n      />'''
          # Keep exactly one complete modal block and remove any duplicated modal body.
          first = text.find('      <TwoFactorSetupModal')
          if first >= 0:
              first_end = text.find('      />', first)
              if first_end < 0:
                  raise SystemExit('First 2FA modal closing tag not found')
              first_end += len('      />')
              before = text[:first_end]
              after = text[first_end:]
              after = re.sub(r'\n\s*open=\{twoFactorModalOpen\}\n\s*token=\{token\}\n\s*onClose=\{\(\) => setTwoFactorModalOpen\(false\)\}\n\s*onCompleted=\{\(\) => \{\n\s*setSecurityStatus\(prev => \(\{ \.\.\.prev, twofaEnabled: true \} \)\);\n\s*showSuccess\("Authenticator 2FA enabled successfully"\);\n\s*\}\}\n\s*\/>', '', after, count=1)
              # The regex above is intentionally strict; fall back to the exact known duplicate if needed.
              exact = '''\n        open={twoFactorModalOpen}\n        token={token}\n        onClose={() => setTwoFactorModalOpen(false)}\n        onCompleted={() => {\n          setSecurityStatus(prev => ({ ...prev, twofaEnabled: true }));\n          showSuccess("Authenticator 2FA enabled successfully");\n        }}\n      />'''
              after = after.replace(exact, '', 1)
              text = before + after
          p.write_text(text, encoding='utf-8')

          # Deposit QR aliases + visible QR in the actual secure deposit first section.
          p = Path('frontend-user/src/pages/SecureDepositPage.jsx')
          text = p.read_text(encoding='utf-8')
          old = "const rows=Array.isArray(w.value?.data?.data)?w.value.data.data:[];setWallets(rows);"
          new = "const rows=(Array.isArray(w.value?.data?.data)?w.value.data.data:[]).map(row=>({...row,qr_image_url:row.qr_image_url||row.qr_url||row.qrCodeUrl||row.qr_code_url||row.qr_code||row.qr_image||row.qr||null}));setWallets(rows);"
          if old in text:
              text = text.replace(old, new, 1)
          address_marker = '{selected?.address&&<div className="mt-4 rounded-2xl border border-white/10 bg-black/20 p-4">'
          qr_card = '''{selected?.qr_image_url&&<div className="mt-4 rounded-2xl border border-cyan-500/20 bg-cyan-500/[0.04] p-4"><div className="flex items-center justify-between"><div><div className="text-xs font-semibold text-white">Scan to deposit</div><div className="mt-1 text-[11px] text-slate-500">Use only this VexaTrade address on the selected network.</div></div><span className="rounded-full border border-cyan-500/20 bg-cyan-500/10 px-2 py-1 text-[10px] font-semibold text-cyan-300">{form.network}</span></div><div className="mt-4 flex justify-center"><div className="rounded-2xl bg-white p-3 shadow-xl"><img src={selected.qr_image_url} alt={`${form.coin} ${form.network} deposit QR`} className="h-48 w-48 rounded-xl object-contain" /></div></div><div className="mt-3 text-center text-[11px] text-slate-500">Verify coin + network before sending.</div></div>}'''
          if address_marker in text and 'Scan to deposit' not in text:
              text = text.replace(address_marker, qr_card + address_marker, 1)
          p.write_text(text, encoding='utf-8')

          # This workflow is only a repair helper; remove it after this run.
          Path('.github/workflows/apply-final-ui-patch.yml').unlink(missing_ok=True)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend-user/src/pages/UserCenterPage.jsx frontend-user/src/pages/SecureDepositPage.jsx .github/workflows/apply-final-ui-patch.yml
          if git diff --cached --quiet; then
            echo "No final source changes required"
          else
            git commit -m "fix: finalize deposit QR and UserCenter JSX"
            git push origin HEAD:master
          fi
