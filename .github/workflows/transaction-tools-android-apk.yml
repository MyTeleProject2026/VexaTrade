name: Transaction Tools Android APK

on:
  push:
    branches: [master]
    paths:
      - "frontend-transaction-tools/**"
      - ".github/workflows/transaction-tools-android-apk.yml"
  pull_request:
    branches: [master]
    paths:
      - "frontend-transaction-tools/**"
      - ".github/workflows/transaction-tools-android-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-apk:
    name: Build and verify installable Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-transaction-tools
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend-transaction-tools/package-lock.json
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Build production web assets
        run: npm run build
      - name: Add Android native project
        run: npx cap add android
      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
      - name: Verify APK exists and is non-empty
        run: test -s android/app/build/outputs/apk/debug/app-debug.apk
      - name: Upload Android APK installer
        uses: actions/upload-artifact@v4
        with:
          name: vexatrade-transaction-tools-android-apk
          path: frontend-transaction-tools/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
