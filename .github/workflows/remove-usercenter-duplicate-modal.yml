name: Remove UserCenter duplicate modal once

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - name: Remove duplicate modal block
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('frontend-user/src/pages/UserCenterPage.jsx')
          text = p.read_text(encoding='utf-8')
          first = text.find('      <TwoFactorSetupModal')
          if first < 0:
              raise SystemExit('first modal not found')
          first_close = text.find('\n      />', first)
          if first_close < 0:
              raise SystemExit('first modal close not found')
          second_open = text.find('\n        open={twoFactorModalOpen}', first_close + 1)
          if second_open >= 0:
              second_close = text.find('\n      />', second_open + 1)
              if second_close < 0:
                  raise SystemExit('second modal close not found')
              text = text[:second_open] + text[second_close + len('\n      />'):]
              p.write_text(text, encoding='utf-8')
              print('Removed duplicate UserCenter 2FA modal body')
          else:
              print('Duplicate modal body already absent')
          Path('.github/workflows/remove-usercenter-duplicate-modal.yml').unlink(missing_ok=True)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend-user/src/pages/UserCenterPage.jsx .github/workflows/remove-usercenter-duplicate-modal.yml
          if git diff --cached --quiet; then
            echo "No duplicate modal change required"
          else
            git commit -m "fix: remove duplicate UserCenter 2FA modal markup"
            git push origin HEAD:master
          fi
