name: One-time transaction polling cleanup

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - name: Remove remaining user financial polling
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          trade = Path('frontend-user/src/pages/TradePage.jsx')
          text = trade.read_text(encoding='utf-8')
          pattern = re.compile(r'''\n\s*// Only open/history are synchronization data\. Wallet and market requests were\n\s*// previously repeated every 2\.5s, which caused the 500 wallet endpoint to be\n\s*// hammered and made the whole terminal look like it was continuously loading\.\n\s*useEffect\(\(\) => \{\n\s*const interval = setInterval\(\(\) => syncTradeState\(false\), 5000\);\n\s*return \(\) => clearInterval\(interval\);\n\s*\}, \[token\]\);\n''')
          text2, count = pattern.subn('\n  // Trade state is loaded on entry and after intentional user actions only.\n  // Do not continuously poll financial endpoints while this page is open.\n', text, count=1)
          if count:
              trade.write_text(text2, encoding='utf-8')
              print('UPDATED TradePage.jsx')
          else:
              print('SKIP TradePage.jsx: polling block not found')

          tx = Path('frontend-user/src/pages/TransactionsPage.jsx')
          text = tx.read_text(encoding='utf-8')
          pattern = re.compile(r'''\n\s*useEffect\(\(\) => \{\n\s*load\(\);\n\s*const interval = setInterval\(\(\) => load\(true\), 10000\);\n\s*return \(\) => clearInterval\(interval\);\n\s*\}, \[\]\);\n''')
          new = '''\n  useEffect(() => {\n    load();\n\n    const handleTransactionComplete = () => {\n      load(true);\n    };\n\n    window.addEventListener("vexa:transaction-complete", handleTransactionComplete);\n    return () => window.removeEventListener("vexa:transaction-complete", handleTransactionComplete);\n  }, []);\n'''
          text2, count = pattern.subn(new, text, count=1)
          if count:
              tx.write_text(text2, encoding='utf-8')
              print('UPDATED TransactionsPage.jsx')
          else:
              print('SKIP TransactionsPage.jsx: polling block not found')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend-user/src/pages/TradePage.jsx frontend-user/src/pages/TransactionsPage.jsx
          if git diff --cached --quiet; then
            echo "No remaining transaction polling changes needed."
          else
            git commit -m "fix: remove remaining user transaction polling"
            git push origin HEAD:master
          fi