name: Normalize frontend API fallbacks

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  normalize:
    if: ${{ github.event.head_commit.message != 'chore: normalize frontend API fallbacks' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Normalize stale API fallback URLs
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              "https://vexatrade-server.onrender.com": "https://vexatrade-5ycu.onrender.com",
              "https://cryptopulse-4rhe.onrender.com": "https://vexatrade-5ycu.onrender.com",
          }

          roots = [Path("frontend-user"), Path("frontend-admin")]
          extensions = {".js", ".jsx", ".ts", ".tsx", ".css", ".html"}
          changed = []

          for root in roots:
              for path in root.rglob("*"):
                  if not path.is_file() or path.suffix.lower() not in extensions:
                      continue
                  text = path.read_text(encoding="utf-8")
                  updated = text
                  for old, new in replacements.items():
                      updated = updated.replace(old, new)
                  if updated != text:
                      path.write_text(updated, encoding="utf-8")
                      changed.append(str(path))

          print("Normalized files:")
          for path in changed:
              print(path)
          PY

      - name: Commit normalized sources
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend-user frontend-admin
          if git diff --cached --quiet; then
            echo "No stale frontend API fallback URLs remain."
            exit 0
          fi
          git commit -m "chore: normalize frontend API fallbacks"
          git push origin HEAD:master
