name: Trade Sections Build

on:
  push:
    branches: [feat/user-trade-fullscreen-sections]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  frontend-user-trade-sections:
    name: Frontend user trade sections build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-user
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend-user/package-lock.json
      - run: npm install --no-audit --no-fund
      - run: npm run build
