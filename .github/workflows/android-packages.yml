name: VexaTrade Android packages
on:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    env:
      USER_KEYSTORE_PATH: ${{ github.workspace }}/.release-keystores/user.jks
      USER_KEYSTORE_PASSWORD: ${{ secrets.VEXATRADE_USER_KEYSTORE_PASSWORD }}
      USER_KEY_ALIAS: ${{ secrets.VEXATRADE_USER_KEY_ALIAS }}
      USER_KEY_PASSWORD: ${{ secrets.VEXATRADE_USER_KEY_PASSWORD }}
      ADMIN_KEYSTORE_PATH: ${{ github.workspace }}/.release-keystores/admin.jks
      ADMIN_KEYSTORE_PASSWORD: ${{ secrets.VEXATRADE_ADMIN_KEYSTORE_PASSWORD }}
      ADMIN_KEY_ALIAS: ${{ secrets.VEXATRADE_ADMIN_KEY_ALIAS }}
      ADMIN_KEY_PASSWORD: ${{ secrets.VEXATRADE_ADMIN_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK command-line tools
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Install Android SDK
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;35.0.0"
      - name: Prepare release signing
        env:
          USER_KEYSTORE_BASE64: ${{ secrets.VEXATRADE_USER_KEYSTORE_BASE64 }}
          ADMIN_KEYSTORE_BASE64: ${{ secrets.VEXATRADE_ADMIN_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$USER_KEYSTORE_PATH")" "$(dirname "$ADMIN_KEYSTORE_PATH")"

          have_release_secrets=true
          for value in "$USER_KEYSTORE_BASE64" "$USER_KEYSTORE_PASSWORD" "$USER_KEY_ALIAS" "$USER_KEY_PASSWORD" "$ADMIN_KEYSTORE_BASE64" "$ADMIN_KEYSTORE_PASSWORD" "$ADMIN_KEY_ALIAS" "$ADMIN_KEY_PASSWORD"; do
            if [ -z "$value" ]; then
              have_release_secrets=false
              break
            fi
          done

          if [ "$have_release_secrets" = true ]; then
            printf '%s' "$USER_KEYSTORE_BASE64" | base64 --decode > "$USER_KEYSTORE_PATH"
            printf '%s' "$ADMIN_KEYSTORE_BASE64" | base64 --decode > "$ADMIN_KEYSTORE_PATH"
            chmod 600 "$USER_KEYSTORE_PATH" "$ADMIN_KEYSTORE_PATH"
            keytool -list -keystore "$USER_KEYSTORE_PATH" -storepass "$USER_KEYSTORE_PASSWORD" -alias "$USER_KEY_ALIAS" >/dev/null
            keytool -list -keystore "$ADMIN_KEYSTORE_PATH" -storepass "$ADMIN_KEYSTORE_PASSWORD" -alias "$ADMIN_KEY_ALIAS" >/dev/null
            echo "ANDROID_SIGNING_MODE=release" >> "$GITHUB_ENV"
            echo "Using configured release signing keys."
          else
            echo "Configured release signing secrets are incomplete; generating ephemeral CI-only signing keys."
            user_password="$(openssl rand -hex 24)"
            admin_password="$(openssl rand -hex 24)"
            echo "::add-mask::$user_password"
            echo "::add-mask::$admin_password"
            keytool -genkeypair -v -keystore "$USER_KEYSTORE_PATH" -storepass "$user_password" -keypass "$user_password" -alias vexatrade-user-ci -keyalg RSA -keysize 2048 -validity 1 -dname "CN=VexaTrade User CI, OU=CI, O=MyTeleProject2026, C=US" -noprompt
            keytool -genkeypair -v -keystore "$ADMIN_KEYSTORE_PATH" -storepass "$admin_password" -keypass "$admin_password" -alias vexatrade-admin-ci -keyalg RSA -keysize 2048 -validity 1 -dname "CN=VexaTrade Admin CI, OU=CI, O=MyTeleProject2026, C=US" -noprompt
            {
              echo "USER_KEYSTORE_PASSWORD=$user_password"
              echo "USER_KEY_ALIAS=vexatrade-user-ci"
              echo "USER_KEY_PASSWORD=$user_password"
              echo "ADMIN_KEYSTORE_PASSWORD=$admin_password"
              echo "ADMIN_KEY_ALIAS=vexatrade-admin-ci"
              echo "ADMIN_KEY_PASSWORD=$admin_password"
              echo "ANDROID_SIGNING_MODE=ephemeral-ci"
            } >> "$GITHUB_ENV"
          fi
      - name: Build user APK/AAB
        working-directory: packaging/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleUserRelease bundleUserRelease
      - name: Build admin APK/AAB
        working-directory: packaging/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleAdminRelease bundleAdminRelease
      - name: Verify release binaries
        working-directory: packaging/android
        run: |
          set -euo pipefail
          for pattern in 'app/build/outputs/apk/user/release/*.apk' 'app/build/outputs/apk/admin/release/*.apk' 'app/build/outputs/bundle/userRelease/*.aab' 'app/build/outputs/bundle/adminRelease/*.aab'; do
            matches=( $pattern ); [ -e "${matches[0]}" ] || { echo "Missing release binary: $pattern" >&2; exit 1; }
          done
          find app/build/outputs -type f \( -name '*.apk' -o -name '*.aab' \) -print -exec stat -c '%n %s bytes' {} \;
          while IFS= read -r f; do
            size=$(stat -c '%s' "$f")
            [ "$size" -gt 0 ] || { echo "Release binary is empty: $f" >&2; exit 1; }
            unzip -t "$f" >/dev/null || { echo "Release binary is not a valid APK/AAB archive: $f" >&2; exit 1; }
          done < <(find app/build/outputs -type f \( -name '*.apk' -o -name '*.aab' \))
      - uses: actions/upload-artifact@v7
        with:
          name: vexatrade-android-release-${{ env.ANDROID_SIGNING_MODE }}
          if-no-files-found: error
          path: |
            packaging/android/app/build/outputs/apk/user/release/*.apk
            packaging/android/app/build/outputs/apk/admin/release/*.apk
            packaging/android/app/build/outputs/bundle/userRelease/*.aab
            packaging/android/app/build/outputs/bundle/adminRelease/*.aab
