name: One-time fix 2FA placement

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - name: Correct 2FA modal placement
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('frontend-user/src/pages/UserCenterPage.jsx')
          text = p.read_text(encoding='utf-8')

          bad = '''    <>\n      <TwoFactorSetupModal\n        open={twoFactorModalOpen}\n        token={token}\n        onClose={() => setTwoFactorModalOpen(false)}\n        onCompleted={() => {\n          setSecurityStatus(prev => ({ ...prev, twofaEnabled: true }));\n          showSuccess("Authenticator 2FA enabled successfully");\n        }}\n      />\n'''
          # Remove the accidentally inserted modal from StatusBadge.
          text = text.replace(bad, '', 1)
          text = text.replace('    </>\n  );\n}\n\nfunction getKycText', '  );\n}\n\nfunction getKycText', 1)

          # Put the modal at the UserCenterPage root, not inside StatusBadge.
          if '<TwoFactorSetupModal' not in text:
              page_marker = 'export default function UserCenterPage() {'
              start = text.find(page_marker)
              if start < 0:
                  raise SystemExit('UserCenterPage declaration not found')
              return_pos = text.find('  return (\n', start)
              if return_pos < 0:
                  raise SystemExit('UserCenterPage return not found')
              modal = '''  return (\n    <>\n      <TwoFactorSetupModal\n        open={twoFactorModalOpen}\n        token={token}\n        onClose={() => setTwoFactorModalOpen(false)}\n        onCompleted={() => {\n          setSecurityStatus(prev => ({ ...prev, twofaEnabled: true }));\n          showSuccess("Authenticator 2FA enabled successfully");\n        }}\n      />\n'''
              text = text[:return_pos] + modal + text[return_pos + len('  return (\n'):]
              # Close the fragment around the existing page root.
              closing = '    </div>\n  );\n}\n'
              pos = text.rfind(closing)
              if pos < 0:
                  raise SystemExit('UserCenterPage closing marker not found')
              text = text[:pos] + '    </div>\n    </>\n  );\n}\n' + text[pos + len(closing):]

          text = text.replace('''{securityStatus.twofaEnabled ? "Disable" : "Enable"}''', '''{securityStatus.twofaEnabled ? "Enabled" : "Enable"}''', 1)
          p.write_text(text, encoding='utf-8')
          print('2FA modal placement corrected')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend-user/src/pages/UserCenterPage.jsx
          if git diff --cached --quiet; then
            echo "No placement correction needed"
          else
            git commit -m "fix: place authenticator setup modal at page root"
            git push origin HEAD:master
          fi