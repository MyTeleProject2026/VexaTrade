name: One-time finalize 2FA and transaction cleanup

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - name: Finalize staged security UI and transaction refresh behavior
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          # Keep the staged 2FA modal mounted only in the main page return.
          p = Path('frontend-user/src/pages/UserCenterPage.jsx')
          text = p.read_text(encoding='utf-8')
          block = '''    <>\n      <TwoFactorSetupModal\n        open={twoFactorModalOpen}\n        token={token}\n        onClose={() => setTwoFactorModalOpen(false)}\n        onCompleted={() => {\n          setSecurityStatus(prev => ({ ...prev, twofaEnabled: true }));\n          showSuccess("Authenticator 2FA enabled successfully");\n        }}\n      />\n'''
          text = text.replace(block, '', 1)
          loading_tail = '''      </div>\n    </>\n  );\n  }\n\n  return (\n'''
          text = text.replace(loading_tail, '''      </div>\n    );\n  }\n\n  return (\n''', 1)
          if '<TwoFactorSetupModal' not in text:
              marker = '  return (\n    <div className="mx-auto max-w-4xl'
              if marker not in text:
                  raise SystemExit('UserCenterPage main return marker not found')
              text = text.replace(marker, '  return (\n    <>\n      <TwoFactorSetupModal\n        open={twoFactorModalOpen}\n        token={token}\n        onClose={() => setTwoFactorModalOpen(false)}\n        onCompleted={() => {\n          setSecurityStatus(prev => ({ ...prev, twofaEnabled: true }));\n          showSuccess("Authenticator 2FA enabled successfully");\n        }}\n      />\n    <div className="mx-auto max-w-4xl', 1)
              text = text.replace('    </div>\n  );\n}', '    </div>\n    </>\n  );\n}', 1)
          text = text.replace('{securityStatus.twofaEnabled ? "Disable" : "Enable"}', '{securityStatus.twofaEnabled ? "Enabled" : "Enable"}', 1)
          p.write_text(text, encoding='utf-8')

          # Remove the 5-second financial synchronization loop from TradePage.
          trade = Path('frontend-user/src/pages/TradePage.jsx')
          text = trade.read_text(encoding='utf-8')
          pattern = re.compile(r'''\n\s*// Only open/history are synchronization data\. Wallet and market requests were\n\s*// previously repeated every 2\.5s, which caused the 500 wallet endpoint to be\n\s*// hammered and made the whole terminal look like it was continuously loading\.\n\s*useEffect\(\(\) => \{\n\s*const interval = setInterval\(\(\) => syncTradeState\(false\), 5000\);\n\s*return \(\) => clearInterval\(interval\);\n\s*\}, \[token\]\);\n''')
          text, count = pattern.subn('\n  // Trade state is loaded on entry and after intentional user actions only.\n  // Do not continuously poll financial endpoints while this page is open.\n', text, count=1)
          if count:
              trade.write_text(text, encoding='utf-8')
              print('UPDATED TradePage polling')

          # Replace transaction page-open polling with one event-driven refresh.
          tx = Path('frontend-user/src/pages/TransactionsPage.jsx')
          text = tx.read_text(encoding='utf-8')
          pattern = re.compile(r'''\n\s*useEffect\(\(\) => \{\n\s*load\(\);\n\s*const interval = setInterval\(\(\) => load\(true\), 10000\);\n\s*return \(\) => clearInterval\(interval\);\n\s*\}, \[\]\);\n''')
          new = '''\n  useEffect(() => {\n    load();\n\n    const handleTransactionComplete = () => {\n      load(true);\n    };\n\n    window.addEventListener("vexa:transaction-complete", handleTransactionComplete);\n    return () => window.removeEventListener("vexa:transaction-complete", handleTransactionComplete);\n  }, []);\n'''
          text, count = pattern.subn(new, text, count=1)
          if count:
              tx.write_text(text, encoding='utf-8')
              print('UPDATED TransactionsPage polling')

          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend-user/src/pages/UserCenterPage.jsx frontend-user/src/pages/TradePage.jsx frontend-user/src/pages/TransactionsPage.jsx
          if git diff --cached --quiet; then
            echo "No source cleanup changes needed"
          else
            git commit -m "fix: finalize security UI and transaction refresh cleanup"
            git push origin HEAD:master
          fi