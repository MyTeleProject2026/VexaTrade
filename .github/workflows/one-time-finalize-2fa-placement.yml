name: One-time finalize 2FA placement

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - name: Move 2FA modal to main page return
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('frontend-user/src/pages/UserCenterPage.jsx')
          text = p.read_text(encoding='utf-8')
          block = '''    <>\n      <TwoFactorSetupModal\n        open={twoFactorModalOpen}\n        token={token}\n        onClose={() => setTwoFactorModalOpen(false)}\n        onCompleted={() => {\n          setSecurityStatus(prev => ({ ...prev, twofaEnabled: true }));\n          showSuccess("Authenticator 2FA enabled successfully");\n        }}\n      />\n'''
          text = text.replace(block, '', 1)
          # Remove fragment closure that was added around the loading return.
          loading_tail = '''      </div>\n    </>\n  );\n  }\n\n  return (\n'''
          text = text.replace(loading_tail, '''      </div>\n    );\n  }\n\n  return (\n''', 1)
          # Insert the modal immediately after the main UserCenterPage return and
          # close the existing root div inside the fragment.
          if '<TwoFactorSetupModal' not in text:
              marker = '  return (\n    <div className="mx-auto max-w-4xl'
              if marker not in text:
                  raise SystemExit('main return marker not found')
              text = text.replace(marker, '  return (\n    <>\n      <TwoFactorSetupModal\n        open={twoFactorModalOpen}\n        token={token}\n        onClose={() => setTwoFactorModalOpen(false)}\n        onCompleted={() => {\n          setSecurityStatus(prev => ({ ...prev, twofaEnabled: true }));\n          showSuccess("Authenticator 2FA enabled successfully");\n        }}\n      />\n    <div className="mx-auto max-w-4xl', 1)
              closing = '''    </div>\n    </>\n  );\n}'''
              # Current file already has fragment closure from prior patch; after
              # removing the loading fragment it remains at the main page end.
              if closing not in text:
                  text = text.replace('''    </div>\n  );\n}''', closing, 1)
          p.write_text(text, encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend-user/src/pages/UserCenterPage.jsx
          if git diff --cached --quiet; then
            echo "No final placement changes needed"
          else
            git commit -m "fix: mount authenticator setup modal on User Center"
            git push origin HEAD:master
          fi