name: One-time user transaction flow upgrade

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - name: Upgrade existing user financial actions
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def patch(path, replacements, import_marker=None):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              original = text
              if import_marker and 'from "../services/actionRequest"' not in text:
                  marker = 'import { useNotification } from "../hooks/useNotification";'
                  if marker not in text:
                      raise SystemExit(f'Missing import marker in {path}')
                  text = text.replace(marker, marker + '\n' + import_marker, 1)
              for old, new in replacements:
                  if old not in text:
                      raise SystemExit(f'Expected source not found in {path}: {old}')
                  text = text.replace(old, new, 1)
              if text != original:
                  p.write_text(text, encoding='utf-8')
                  print(f'updated {path}')
              else:
                  print(f'unchanged {path}')

          action_import = 'import { createActionIdempotencyKey, runSingleUserAction } from "../services/actionRequest";'

          patch(
              'frontend-user/src/pages/ConvertPage.jsx',
              [
                  ('      const amount = Number(form.fromAmount || 0);\n\n      const res = await convertApi.execute(',
                   '      const amount = Number(form.fromAmount || 0);\n      const idempotencyKey = createActionIdempotencyKey("convert");\n\n      const res = await runSingleUserAction("convert-submit", () => convertApi.execute('),
                  ('          fromAmount: amount,\n        },\n        token\n      );',
                   '          fromAmount: amount,\n          idempotencyKey,\n        },\n        token\n      ));'),
              ],
              action_import,
          )

          patch(
              'frontend-user/src/pages/FundsPage.jsx',
              [
                  ('      const res = await fundsApi.apply({ plan_id: applyModal.id, amount }, token);',
                   '      const idempotencyKey = createActionIdempotencyKey("funds");\n      const res = await runSingleUserAction("funds-submit", () => fundsApi.apply({ plan_id: applyModal.id, amount, idempotencyKey }, token));'),
              ],
              action_import,
          )

          patch(
              'frontend-user/src/pages/LoanPage.jsx',
              [
                  ('      const res = await loanApi.apply(payload, token);',
                   '      const idempotencyKey = createActionIdempotencyKey("loan");\n      const res = await runSingleUserAction("loan-submit", () => loanApi.apply({ ...payload, idempotencyKey }, token));'),
              ],
              action_import,
          )

          patch(
              'frontend-user/src/pages/TradePage.jsx',
              [
                  ('      setPlacing(true);\n      const res = await tradeApi.place({ pair, direction, timer: Number(timer), amount: Number(amount) }, token);',
                   '      setPlacing(true);\n      const idempotencyKey = createActionIdempotencyKey("trade");\n      const res = await runSingleUserAction("trade-submit", () => tradeApi.place({ pair, direction, timer: Number(timer), amount: Number(amount), idempotencyKey }, token));'),
              ],
              action_import,
          )

          patch(
              'frontend-user/src/pages/AssetsPage.jsx',
              [
                  ('    try {\n      setLoading(true);\n      const res = await fetch(`${API_BASE_URL}/api/user/transfer`, {',
                   '    try {\n      setLoading(true);\n      const idempotencyKey = createActionIdempotencyKey("transfer");\n      const res = await runSingleUserAction("transfer-submit", () => fetch(`${API_BASE_URL}/api/user/transfer`, {'),
                  ('          note: note || null\n        })\n      });',
                   '          note: note || null,\n          idempotencyKey,\n        })\n      }));'),
              ],
              action_import,
          )
          PY

          cd frontend-user
          npm ci --no-audit --no-fund
          npm run build
          cd ..

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend-user/src/pages
          if git diff --cached --quiet; then
            echo "No user transaction page changes required."
          else
            git commit -m "feat: unify user transaction single-action lifecycle"
            git push origin HEAD:master
          fi
