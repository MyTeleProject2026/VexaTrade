name: Transaction Tools Mobile Packages

on:
  push:
    branches: [master]
    paths:
      - "frontend-transaction-tools/**"
      - ".github/workflows/transaction-tools-mobile.yml"
  pull_request:
    branches: [master]
    paths:
      - "frontend-transaction-tools/**"
      - ".github/workflows/transaction-tools-mobile.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-transaction-tools
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install web and native dependencies
        run: npm install --no-audit --no-fund
      - name: Build responsive web app
        run: npm run build
      - name: Add Android platform
        run: npx cap add android
      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
      - name: Upload installable Android testing APK
        uses: actions/upload-artifact@v4
        with:
          name: vexatrade-android-debug-apk
          path: frontend-transaction-tools/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  ios-simulator:
    name: Build iOS Simulator app
    runs-on: macos-15
    defaults:
      run:
        working-directory: frontend-transaction-tools
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install web and native dependencies
        run: npm install --no-audit --no-fund
      - name: Build responsive web app
        run: npm run build
      - name: Add iOS platform
        run: npx cap add ios
      - name: Build iOS Simulator app
        run: xcodebuild -workspace ios/App/App.xcworkspace -scheme App -sdk iphonesimulator -configuration Debug -derivedDataPath build/ios CODE_SIGNING_ALLOWED=NO build
      - name: Package iOS Simulator app
        run: |
          cd build/ios/Build/Products/Debug-iphonesimulator
          ditto -c -k --sequesterRsrc --keepParent App.app "$GITHUB_WORKSPACE/frontend-transaction-tools/vexatrade-ios-simulator-app.zip"
      - name: Upload iOS Simulator package
        uses: actions/upload-artifact@v4
        with:
          name: vexatrade-ios-simulator-app
          path: frontend-transaction-tools/vexatrade-ios-simulator-app.zip
          if-no-files-found: error
          retention-days: 14
