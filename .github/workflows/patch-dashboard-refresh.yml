name: One-time dashboard refresh cleanup

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove dashboard financial polling
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('frontend-user/src/pages/DashboardPage.jsx')
          text = p.read_text(encoding='utf-8')
          old = '''  useEffect(() => {\n    mountedRef.current = true;\n    loadData();\n    const interval = setInterval(() => loadData(true), 30000);\n    return () => {\n      mountedRef.current = false;\n      clearInterval(interval);\n    };\n  }, []);'''
          new = '''  useEffect(() => {\n    mountedRef.current = true;\n    loadData();\n    return () => {\n      mountedRef.current = false;\n    };\n  }, []);'''
          if old not in text:
              raise SystemExit('Dashboard polling block not found')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend-user/src/pages/DashboardPage.jsx
          git commit -m "fix: remove dashboard financial polling"
          git push origin HEAD:master
