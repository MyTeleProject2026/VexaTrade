name: One-time dashboard portfolio balance fix

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use portfolio asset value for dashboard balance
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('frontend-user/src/pages/DashboardPage.jsx')
          text = p.read_text(encoding='utf-8')
          text = text.replace(
              '  const [wallet, setWallet] = useState({ balance: 0, walletLabel: "Main Wallet" });\n',
              '  const [wallet, setWallet] = useState({ balance: 0, walletLabel: "Main Wallet" });\n  const [portfolioValue, setPortfolioValue] = useState(0);\n',
              1,
          )
          old = '''      const [walletRes, marketRes] = await Promise.allSettled([\n        withTimeout(userApi.getWalletSummary(token)),\n        withTimeout(marketApi.home()),\n      ]);'''
          new = '''      const [walletRes, marketRes, assetsRes] = await Promise.allSettled([\n        withTimeout(userApi.getWalletSummary(token)),\n        withTimeout(marketApi.home()),\n        withTimeout(userApi.getUserAssets(token)),\n      ]);'''
          if old not in text:
              raise SystemExit('Dashboard critical request block not found')
          text = text.replace(old, new, 1)
          old = '''      if (marketRes.status === "fulfilled") setMarkets(Array.isArray(marketRes.value?.data?.data) ? marketRes.value.data.data : []);\n      setLoading(false);'''
          new = '''      if (marketRes.status === "fulfilled") setMarkets(Array.isArray(marketRes.value?.data?.data) ? marketRes.value.data.data : []);\n      if (assetsRes.status === "fulfilled") {\n        const payload = assetsRes.value?.data || {};\n        const rows = Array.isArray(payload?.data?.assets)\n          ? payload.data.assets\n          : (Array.isArray(payload?.assets) ? payload.assets : []);\n        const value = rows.reduce((sum, item) => {\n          const explicit = Number(item?.usdt_value ?? item?.value_usdt ?? item?.value);\n          if (Number.isFinite(explicit) && explicit !== 0) return sum + explicit;\n          const amount = Number(item?.amount ?? item?.available_balance ?? item?.balance ?? 0);\n          const price = Number(item?.current_price ?? item?.price_usdt ?? item?.price ?? 0);\n          return sum + (amount * price);\n        }, 0);\n        setPortfolioValue(Number.isFinite(value) ? value : 0);\n      }\n      setLoading(false);'''
          if old not in text:
              raise SystemExit('Dashboard market block not found')
          text = text.replace(old, new, 1)
          old = '  const displayBalance = hasJointAccount ? combinedBalanceData.combinedBalance : wallet.balance || 0;'
          new = '  const displayBalance = hasJointAccount ? combinedBalanceData.combinedBalance : portfolioValue;'
          if old not in text:
              raise SystemExit('Dashboard display balance line not found')
          text = text.replace(old, new, 1)
          p.write_text(text, encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend-user/src/pages/DashboardPage.jsx
          git commit -m "fix: show portfolio asset value in dashboard balance"
          git push origin HEAD:master
