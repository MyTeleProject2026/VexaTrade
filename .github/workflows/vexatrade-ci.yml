name: VexaTrade CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  backend:
    name: Backend validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm install --no-audit --no-fund
      - name: Validate backend entrypoints and financial routes
        run: |
          node --check server.js
          node --check schemaBootstrap.js
          node --check src/middleware/auth.js
          node --check src/middleware/transactionSecurity.js
          node --check src/routes/transactionSecurityRoutes.js
          node --check src/routes/depositRoutes.js
          node --check src/routes/withdrawalRoutes.js
          node --check src/routes/convertRoutes.js
          node --check src/routes/transferRoutes.js
          node --check src/routes/tradeRoutes.js
          node --check src/routes/fundsRoutes.js
          node --check src/routes/loanRoutes.js
          node --check src/routes/profitWithdrawalRoutes.js
          node --check src/routes/adminRoutes.js
          node --check src/routes/adminControlCenterRoutes.js
          node --check src/routes/adminNotifications.js
          node --check src/routes/vexaAccountSso.js
          node --check src/routes/securityRoutes.js
          node --check src/routes/jointAccountRoutes.js
          node --check src/routes/assetOperationsRoutes.js
          node --check src/routes/assetSettlementRoutes.js
          node --check src/routes/supportedAssetRoutes.js
          node --check src/routes/legalRoutes.js
          node --check src/routes/supportRoutes.js
          node --check services/assetLedgerService.js
          node scripts/validateFinancialContracts.js
      - name: Validate runtime dependency graph
        run: |
          node -e "require('./cloudinaryStorage'); console.log('Cloudinary storage dependency graph loaded')"
          node -e "require('cloudinary'); console.log('cloudinary is installed')"
          node -e "require('multer'); console.log('multer is installed')"
          node -e "require('socket.io'); console.log('socket.io is installed')"

  frontend-user:
    name: Frontend user build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-user
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend-user/package-lock.json
      - run: npm install --no-audit --no-fund
      - run: npm run build

  frontend-admin:
    name: Frontend admin build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend-admin/package-lock.json
      - run: npm install --no-audit --no-fund
      - run: npm run build
