name: Fix UserCenter JSX

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - name: Repair UserCenter JSX
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('frontend-user/src/pages/UserCenterPage.jsx')
          text = p.read_text(encoding='utf-8')
          old = '''      <div className="flex min-h-[60vh] items-center justify-center bg-[#050812]">\n        <div className="h-8 w-8 animate-spin rounded-full border-2 border-cyan-500 border-t-transparent" />\n      </div>\n    );\n  }\n\n  return ('''
          new = '''      <div className="flex min-h-[60vh] items-center justify-center bg-[#050812]">\n        <div className="h-8 w-8 animate-spin rounded-full border-2 border-cyan-500 border-t-transparent" />\n      </div>\n    </>\n    );\n  }\n\n  return ('''
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('Expected UserCenter loading fragment was not found')
          p.write_text(text, encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend-user/src/pages/UserCenterPage.jsx
          if git diff --cached --quiet; then
            echo "UserCenter JSX already repaired"
          else
            git commit -m "fix: repair UserCenter loading fragment JSX"
            git pull --rebase origin master
            git push origin HEAD:master
          fi
