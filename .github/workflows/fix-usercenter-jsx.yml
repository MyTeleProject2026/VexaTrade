name: Fix UserCenter JSX

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - name: Repair UserCenter JSX
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('frontend-user/src/pages/UserCenterPage.jsx')
          text = p.read_text(encoding='utf-8')

          modal = '''      <TwoFactorSetupModal\n        open={twoFactorModalOpen}\n        token={token}\n        onClose={() => setTwoFactorModalOpen(false)}\n        onCompleted={() => {\n          setSecurityStatus(prev => ({ ...prev, twofaEnabled: true }));\n          showSuccess("Authenticator 2FA enabled successfully");\n        }}\n      />\n'''

          # Restore the loading branch to a single spinner root.
          loading_prefix = '  if (loading) {\n    return (\n    <>\n' + modal
          if loading_prefix in text:
              text = text.replace(loading_prefix, '  if (loading) {\n    return (\n', 1)
          elif '  if (loading) {\n    return (\n      <div className="flex min-h-[60vh]' not in text:
              raise SystemExit('Unexpected UserCenter loading branch')

          # Mount the 2FA modal at the UserCenter page root and preserve the existing closing fragment.
          main_marker = '  return (\n    <div className="mx-auto max-w-4xl'
          if main_marker in text and '  return (\n    <>\n' + modal not in text:
              text = text.replace(main_marker, '  return (\n    <>\n' + modal + '    <div className="mx-auto max-w-4xl', 1)

          p.write_text(text, encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend-user/src/pages/UserCenterPage.jsx
          if git diff --cached --quiet; then
            echo "UserCenter JSX already repaired"
          else
            git commit -m "fix: repair UserCenter JSX root structure"
            git pull --rebase origin master
            git push origin HEAD:master
          fi
