name: Fix UserCenter JSX

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - name: Repair UserCenter JSX
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('frontend-user/src/pages/UserCenterPage.jsx')
          text = p.read_text(encoding='utf-8')

          # The loading branch must be a normal single-root return.
          loading_open = '  if (loading) {\n    return (\n    <>\n      <TwoFactorSetupModal'
          loading_fixed = '  if (loading) {\n    return (\n      <div className="flex min-h-[60vh] items-center justify-center bg-[#050812]">'
          if loading_open in text:
              start = text.index(loading_open)
              modal_start = text.index('      <TwoFactorSetupModal', start)
              spinner_start = text.index('      <div className="flex min-h-[60vh]', modal_start)
              spinner_end = text.index('    );\n  }\n\n  return (', spinner_start)
              spinner = text[spinner_start:spinner_end]
              text = text[:start] + loading_fixed + '\n' + spinner + '\n    );\n  }\n\n  return (\n    <>\n      <TwoFactorSetupModal' + text[spinner_end + len('    );\n  }\n\n  return (\n    <div className="mx-auto max-w-4xl space-y-5 px-4 py-5 sm:space-y-6 sm:px-6 sm:py-6">'):]
              # The reconstruction above intentionally preserves the existing main JSX after the modal.
          else:
              # Handle the exact current form without reconstructing the whole component.
              bad = '''  if (loading) {\n    return (\n    <>\n      <TwoFactorSetupModal'''
              if bad in text:
                  text = text.replace(bad, '  if (loading) {\n    return (\n      <div className="flex min-h-[60vh] items-center justify-center bg-[#050812]">', 1)

          # Safe direct normalization for the known malformed current structure.
          text = text.replace('      <TwoFactorSetupModal\n        open={twoFactorModalOpen}', '      <TwoFactorSetupModal\n        open={twoFactorModalOpen}', 1)
          p.write_text(text, encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend-user/src/pages/UserCenterPage.jsx
          if git diff --cached --quiet; then
            echo "No UserCenter source change required"
          else
            git commit -m "fix: restore UserCenter root fragment structure"
            git pull --rebase origin master
            git push origin HEAD:master
          fi
