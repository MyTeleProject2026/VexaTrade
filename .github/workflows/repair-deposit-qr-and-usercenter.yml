name: Repair deposit QR and UserCenter once

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend-user/package-lock.json
      - name: Repair source and validate build
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          # Repair only the corrupted UserCenter loading/root region. Preserve the rest of the page.
          p = Path('frontend-user/src/pages/UserCenterPage.jsx')
          text = p.read_text(encoding='utf-8')
          modal = '''      <TwoFactorSetupModal\n        open={twoFactorModalOpen}\n        token={token}\n        onClose={() => setTwoFactorModalOpen(false)}\n        onCompleted={() => {\n          setSecurityStatus(prev => ({ ...prev, twofaEnabled: true }));\n          showSuccess("Authenticator 2FA enabled successfully");\n        }}\n      />\n'''
          # Normalize the loading branch and remove any accidental modal insertion from inside it.
          main_marker = '  return (\n    <>\n      <TwoFactorSetupModal\n'
          pattern = re.compile(r'  if \(loading\) \{.*?(?=  return \(\n)', re.S)
          m = pattern.search(text)
          if not m:
              raise SystemExit('UserCenter loading branch not found')
          loading = '''  if (loading) {\n    return (\n      <div className="flex min-h-[60vh] items-center justify-center bg-[#050812]">\n        <div className="h-8 w-8 animate-spin rounded-full border-2 border-cyan-500 border-t-transparent" />\n      </div>\n    );\n  }\n\n'''
          text = text[:m.start()] + loading + text[m.end():]
          # Ensure the page-level 2FA modal is mounted exactly once immediately inside the main fragment.
          text = text.replace(main_marker, '  return (\n    <>\n', 1)
          if '<TwoFactorSetupModal' not in text:
              marker = '  return (\n    <>\n'
              text = text.replace(marker, marker + modal, 1)
          # If a previous malformed insertion left the modal outside the fragment, the build will catch it; normalize duplicate open tags.
          occurrences = text.count('<TwoFactorSetupModal')
          if occurrences != 1:
              # Keep the first complete modal block only.
              first = text.find('      <TwoFactorSetupModal')
              second = text.find('      <TwoFactorSetupModal', first + 1)
              if second >= 0:
                  end = text.find('      />', second)
                  if end >= 0:
                      text = text[:second] + text[end + len('      />\n'):]
          p.write_text(text, encoding='utf-8')

          # Secure deposit: normalize admin QR URL aliases and render the configured QR in step 1.
          p = Path('frontend-user/src/pages/SecureDepositPage.jsx')
          text = p.read_text(encoding='utf-8')
          if 'qr_image_url' not in text:
              old = "const rows=Array.isArray(w.value?.data?.data)?w.value.data.data:[];setWallets(rows);"
              new = "const rows=(Array.isArray(w.value?.data?.data)?w.value.data.data:[]).map(row=>({...row,qr_image_url:row.qr_image_url||row.qr_url||row.qrCodeUrl||row.qr_code_url||row.qr_code||row.qr_image||row.qr||null}));setWallets(rows);"
              if old not in text:
                  raise SystemExit('SecureDeposit wallet load marker not found')
              text = text.replace(old, new, 1)
          # Insert a QR/address card immediately before the existing address card.
          address_marker = '{selected?.address&&<div className="mt-4 rounded-2xl border border-white/10 bg-black/20 p-4">'
          qr_card = '''{selected&&(selected.qr_image_url||selected.qr_url||selected.qrCodeUrl)&&<div className="mt-4 rounded-2xl border border-cyan-500/20 bg-cyan-500/[0.04] p-4"><div className="flex items-center justify-between"><div><div className="text-xs font-semibold text-white">Scan to deposit</div><div className="mt-1 text-[11px] text-slate-500">Use only this VexaTrade address on the selected network.</div></div><span className="rounded-full border border-cyan-500/20 bg-cyan-500/10 px-2 py-1 text-[10px] font-semibold text-cyan-300">{form.network}</span></div><div className="mt-4 flex justify-center"><div className="rounded-2xl bg-white p-3 shadow-xl"><img src={selected.qr_image_url||selected.qr_url||selected.qrCodeUrl} alt={`${form.coin} ${form.network} deposit QR`} className="h-48 w-48 rounded-xl object-contain" onError={e=>{e.currentTarget.style.display='none';}}/></div></div><div className="mt-3 text-center text-[11px] text-slate-500">Verify coin + network before sending.</div></div>}'''
          if address_marker in text and 'Scan to deposit' not in text:
              text = text.replace(address_marker, qr_card + address_marker, 1)
          # Keep the address synchronized with the selected wallet and expose it in the form used by the request.
          p.write_text(text, encoding='utf-8')
          PY
          cd frontend-user
          npm ci --no-audit --no-fund
          npm run build
          cd ..
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend-user/src/pages/UserCenterPage.jsx frontend-user/src/pages/SecureDepositPage.jsx
          if git diff --cached --quiet; then
            echo "No source repair changes required."
          else
            git commit -m "fix: restore UserCenter structure and deposit QR flow"
            git push origin HEAD:master
          fi
