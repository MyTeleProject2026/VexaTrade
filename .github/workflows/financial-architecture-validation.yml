name: VexaTrade Financial Architecture Validation

on:
  pull_request:
    branches: [master]
  push:
    branches: [master, vexatrade-final-architecture-hardening]

jobs:
  backend-syntax:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm install --no-audit --no-fund
      - name: Validate financial API contracts
        run: node scripts/validateFinancialContracts.js
      - name: Check backend JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          find . -type f -name '*.js' -not -path './node_modules/*' -print0 | xargs -0 -n1 node --check

  frontend-user-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-user
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend-user/package-lock.json
      - run: npm install --no-audit --no-fund
      - run: npm run build

  frontend-admin-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend-admin/package-lock.json
      - run: npm install --no-audit --no-fund
      - run: npm run build
