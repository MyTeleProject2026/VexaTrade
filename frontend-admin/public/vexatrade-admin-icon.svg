<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0e14" />
      <stop offset="100%" stop-color="#05070a" />
    </linearGradient>

    <!-- Cyan Glow Filter -->
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Cyan Main Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#0088ff" />
    </linearGradient>

    <!-- Red Candlestick Gradient -->
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff4d4d" />
      <stop offset="100%" stop-color="#a81c1c" />
    </linearGradient>
  </defs>

  <!-- Dark Background Plate -->
  <rect width="500" height="500" rx="40" fill="url(#bgGrad)" />

  <!-- Outer Hexagon Frame -->
  <polygon points="250,35 435,142 435,358 250,465 65,358 65,142" 
           fill="none" stroke="url(#cyanGrad)" stroke-width="14" stroke-linejoin="round" filter="url(#cyanGlow)" />

  <!-- Inner Hexagon Accent Frame -->
  <polygon points="250,68 405,158 405,342 250,432 95,342 95,158" 
           fill="rgba(0, 240, 255, 0.03)" stroke="rgba(0, 240, 255, 0.25)" stroke-width="3" stroke-linejoin="round" />

  <!-- Trading Candlesticks -->
  <!-- Cyan Candlestick Left -->
  <line x1="160" y1="280" x2="160" y2="380" stroke="#00f0ff" stroke-width="3" opacity="0.6"/>
  <rect x="151" y="300" width="18" height="55" rx="3" fill="#00f0ff" opacity="0.6"/>

  <!-- Red Center Candlestick -->
  <line x1="210" y1="210" x2="210" y2="390" stroke="#ff4d4d" stroke-width="3"/>
  <rect x="200" y="235" width="20" height="120" rx="3" fill="url(#redGrad)"/>

  <!-- Cyan Candlestick Right -->
  <line x1="330" y1="250" x2="330" y2="360" stroke="#00f0ff" stroke-width="3" opacity="0.6"/>
  <rect x="321" y="270" width="18" height="65" rx="3" fill="#00f0ff" opacity="0.6"/>

  <!-- Admin Key & Gear Overlay Component -->
  <g transform="translate(95, 115)">
    <!-- Key Head Outer Gear Ring -->
    <circle cx="50" cy="50" r="32" fill="#0b0e14" stroke="url(#cyanGrad)" stroke-width="8" filter="url(#cyanGlow)"/>
    
    <!-- Gear Teeth Outer Elements -->
    <path d="M 50 10 L 50 18 M 50 82 L 50 90 M 10 50 L 18 50 M 82 50 L 90 50 M 22 22 L 28 28 M 72 72 L 78 78 M 22 78 L 28 72 M 72 22 L 78 28" 
          stroke="#00f0ff" stroke-width="6" stroke-linecap="round" />

    <!-- Inner Key Center Hole -->
    <circle cx="50" cy="50" r="12" fill="none" stroke="#00f0ff" stroke-width="5"/>

    <!-- Key Shaft & Teeth -->
    <path d="M 50 82 L 50 165 M 50 120 L 70 120 M 50 145 L 64 145" 
          stroke="url(#cyanGrad)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" filter="url(#cyanGlow)"/>
  </g>

  <!-- Upward Trend Chart Line -->
  <path d="M 100 335 L 185 295 L 250 330 L 410 155" 
        fill="none" stroke="url(#cyanGrad)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" filter="url(#cyanGlow)"/>

  <!-- Arrow Cap on Chart -->
  <polygon points="410,155 370,158 407,195" fill="#00f0ff" />
</svg>
